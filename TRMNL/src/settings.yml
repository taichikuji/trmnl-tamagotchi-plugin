  description: |
    <p>Created by Ivan Perez. TRMNLGotchi brings a nostalgic P1-style virtual pet to your TRMNL. It hatches, eats, plays, sleeps, and evolves according to its care history. A seeded caretaker looks after each generation, and a new egg follows the end of each life.</p>
    <p>Runs entirely inside TRMNL with Serverless, Saved State, and Liquid. Supports TRMNL OG and X, portrait orientation, and all four layouts.</p>
