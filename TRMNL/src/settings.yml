---
name: TRMNLGotchi
description: Your nostalgic friend on TRMNL!
icon: media/icon.svg
strategy: static
static_data: '{}'
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: 3.4.3
serverless_language: node
refresh_interval: 15
custom_fields:
# TRMNL reuses recipe-master screens without an input field; author_bio does not count.
# Keep this field even though the simulation needs no user configuration.
- keyname: pet_instance
  name: Pet
  field_type: select
  options:
  - My own pet
  default: my_own_pet
  description: Raise a personal pet with its own progress.
- keyname: plugin_info
  name: About This Plugin
  field_type: author_bio
  category: life
  description: "TRMNLGotchi is a low-maintenance virtual pet for your TRMNL, created by Ivan Perez!<br/>Unofficial fan project, unaffiliated with BANDAI or Bandai Namco; Tamagotchi is a BANDAI trademark."
  github_url: https://github.com/taichikuji/trmnl-tamagotchi-plugin
  learn_more_url: https://github.com/taichikuji/trmnl-tamagotchi-plugin/tree/main/TRMNL#setup
